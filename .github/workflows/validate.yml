name: Validate and package preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Importer tests and fixtures
        run: |
          python -m pip install -r tools/requirements.txt pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/make_fixtures.py
          python tests/make_ui_fixture.py
      - name: Core and cross-language tests
        run: dotnet run --project tests/CoreTests.csproj -- .test-fixtures/still.ecp .test-fixtures/motion.ecp .test-fixtures/short.ecp
      - name: Download audited reference assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/evilfactory/LuaCsForBarotrauma/releases/download/latest/luacsforbarotrauma_refs.zip' -OutFile refs.zip
          if ((Get-FileHash refs.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0fcf87af80a33575346a959b29f9f1af9e8c3f6f569974e35ab56007d5cdb487') { throw 'References changed. Audit the new game API before updating the pin.' }
          Expand-Archive refs.zip .references
      - name: Compile both targets
        run: |
          dotnet build tools/CompileCheck.csproj -p:Flavor=Client --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/CompileCheck.csproj -p:Flavor=Server --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real runtime hooks and software graphics regression
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/evilfactory/LuaCsForBarotrauma/releases/download/latest/luacsforbarotrauma_build_windows_client.zip' -OutFile runtime.zip
          if ((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b089eaaea806cd0ea34447b1c36c9f1005c4c62ff13be18f0dfb84a0306de9be') { throw 'Audited runtime changed' }
          Expand-Archive runtime.zip .runtime-client
          $runtime=(Resolve-Path .runtime-client).Path
          dotnet run --project tests/CoreTests.csproj -- --probe $runtime Barotrauma tools/bin/Client/net8.0/CompileCheck.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GraphicsTests.csproj -p:RuntimeDir=$runtime -- .test-fixtures/short.ecp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone local importer
        run: python -m PyInstaller --clean --onefile --name EmoteImporter --distpath build/importer tools/import_emotes.py
      - name: Test executable and package
        run: |
          build/importer/EmoteImporter.exe .test-fixtures/中文表情.png .test-fixtures/motion.gif --library .test-fixtures/exe-library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package.py --importer build/importer/EmoteImporter.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive dist/EmoteChat-0.3.0.zip .test-fixtures/installed
          .test-fixtures/installed/LocalMods/EmoteChat/Tools/EmoteImporter.exe .test-fixtures/motion.gif
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library=dotnet run --no-build --project tests/CoreTests.csproj -- --library-location
          if (-not (Get-ChildItem $library -Filter *.ecp)) { throw 'Importer and game disagree about canonical library' }
          $portable=(New-Item -ItemType Directory .test-fixtures/portable-on-other-drive).FullName
          Copy-Item build/importer/EmoteImporter.exe $portable
          $short=(Resolve-Path .test-fixtures/short.gif).Path
          Push-Location $portable
          try { & .\EmoteImporter.exe $short; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }
          if ((Get-ChildItem $library -Filter *.ecp).Count -lt 2) { throw 'Portable EXE did not share the user library' }
          python -m unittest discover -s tests -p "test_package.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_workshop.py --importer build/importer/EmoteImporter.exe
      - name: Parse workshop PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem workshop -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EmoteChat-0.3.0
          path: |
            dist/*.zip
            dist/*ui-preview.png
