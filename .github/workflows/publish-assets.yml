name: Publish verified preview assets
on:
  push:
    paths:
      - .github/workflows/publish-assets.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EmoteChat-0.1.0-preview
          run-id: 41661944454
          github-token: ${{ github.token }}
          path: release-assets
      - name: Attach both verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.1.0-preview release-assets/*.zip --clobber
