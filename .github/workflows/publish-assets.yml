name: Publish verified preview assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful validation run ID
        required: true
      tag:
        description: Existing release tag matching the validated source
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EmoteChat-0.2.0
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Attach both verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
